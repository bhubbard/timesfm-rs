name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-lint:
    name: Test, Clippy & Docs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --lib --bins --examples --features full

      - name: Build Documentation
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --features full

      - name: Run Test Suite (full features)
        run: cargo test --features full

      - name: Verify Benchmark Example
        run: cargo run --example bench_vs_jax
